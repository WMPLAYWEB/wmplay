<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Red Neon Gradient -->
    <linearGradient id="wmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#09090d" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Badge -->
  <g transform="translate(10, 10)">
    <!-- Badge Background -->
    <rect width="80" height="80" rx="20" fill="url(#badgeBg)" stroke="url(#wmRed)" stroke-width="2.5" />
    
    <!-- Stylized Play Symbol with W cut -->
    <!-- Left diagonal stem -->
    <path d="M22 26 L30 54 L38 34 L44 48 L40 54 L26 54 L18 26 Z" fill="#991b1b" />
    <!-- Dynamic Play Triangle -->
    <polygon points="34,25 64,40 34,55" fill="url(#wmRed)" filter="url(#logoGlow)" />
    <!-- Shimmer Highlight -->
    <polygon points="34,25 52,34 34,40" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(108, 54)">
    <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" letter-spacing="2">
      <tspan fill="#ffffff">WM</tspan><tspan fill="#ef4444" filter="url(#logoGlow)">PLAY</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(110, 78)">
    <text font-family="'Arial', sans-serif" font-weight="800" font-size="11" fill="#f87171" letter-spacing="4" opacity="0.95">
      STREAMING &amp; TV AO VIVO
    </text>
  </g>
</svg>
