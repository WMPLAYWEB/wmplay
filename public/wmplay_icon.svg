<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e2d" />
      <stop offset="60%" stop-color="#0f0f15" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Red Neon Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Dark Red Shadow Gradient -->
    <linearGradient id="redDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.8" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="brightBlur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Glowing Red Ring -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#redGrad)" stroke-width="8" opacity="0.8" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" />

  <!-- Central Emblem Container -->
  <g transform="translate(0, -20)">
    <!-- Stylized Hexagonal / Shield Badge -->
    <polygon points="256,70 380,142 380,286 256,358 132,286 132,142" 
             fill="#09090f" stroke="url(#redGrad)" stroke-width="7" filter="url(#glow)" />
    
    <!-- Inner Accent Lines of Badge -->
    <polygon points="256,86 366,150 366,278 256,342 146,278 146,150" 
             fill="none" stroke="#dc2626" stroke-width="2" opacity="0.3" />

    <!-- Stylized "WM" Geometric Path -->
    <!-- W Left Wing -->
    <path d="M166 170 L195 275 L225 195 L242 240 L220 285 L180 285 L150 170 Z" 
          fill="url(#redDarkGrad)" />
    
    <!-- Play Triangle (Heart of WMPLAY) -->
    <polygon points="230,175 330,235 230,295" 
             fill="url(#redGrad)" filter="url(#strongGlow)" />
    
    <!-- Light Reflection on Play Triangle -->
    <polygon points="230,175 295,214 230,235" 
             fill="#ffffff" opacity="0.28" />
  </g>

  <!-- Wordmark "WMPLAY" -->
  <g transform="translate(256, 400)">
    <text text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" letter-spacing="4">
      <tspan fill="#ffffff">WM</tspan><tspan fill="#ef4444" filter="url(#glow)">PLAY</tspan>
    </text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(256, 440)">
    <text text-anchor="middle" font-family="'Arial', sans-serif" font-weight="800" font-size="16" fill="#f87171" letter-spacing="8" opacity="0.95">
      STREAMING &amp; TV
    </text>
  </g>
</svg>
